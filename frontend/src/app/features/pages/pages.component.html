<nb-layout>
  <nb-layout-header fixed>
    <div class="header-container">
      <button nbButton outline status="primary" size="medium" (click)="sidebar.toggle()" class="menu-toggle">
        <nb-icon icon="menu-outline"></nb-icon>
      </button>

      <h4>Movies App</h4>

      <div class="spacer"></div>

      <nb-actions size="medium">
        <nb-action>
          <nb-user
            [name]="user.name"
            [picture]="user.picture"
            [nbContextMenu]="userMenu"
            nbContextMenuTag="user-menu">
          </nb-user>
        </nb-action>
      </nb-actions>
    </div>
  </nb-layout-header>

  <nb-sidebar #sidebar class="menu-sidebar" tag="menu-sidebar" responsive>
    <nb-menu [items]="menuItems"></nb-menu>
  </nb-sidebar>

  <nb-layout-column>
    <router-outlet></router-outlet>
  </nb-layout-column>
</nb-layout>
